services:
  - type: web
    name: scholarpilot-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # 1. Neon PostgreSQL Database Connection
      - key: DATABASE_URL
        sync: false

      # 2. Resend Email API
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: ScholarPilot AI <onboarding@resend.dev>

      # 3. Google AI Studio (Gemini 2.5 Flash / Flash Lite)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # 4. Security & Session Integrity
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
