name: Weekly Scholarship Automation Report

on:
  schedule:
    # Runs every Friday at 07:00 UTC (10:00 AM Palestine / Jerusalem time)
    - cron: '0 7 * * 5'
  workflow_dispatch: # Allows manual trigger from the Actions tab anytime

jobs:
  send-scholarships-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scholarship Automation & Dispatch Email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          python send_scholarship_report.py
